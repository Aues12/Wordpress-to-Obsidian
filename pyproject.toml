[project]
name = "wordpress-to-obsidian"
version = "0.1.0"
description = "Convert WordPress content into Obsidian-ready markdown."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "markdownify>=1.2.0",
  "PyYAML>=6.0.2",
  "requests>=2.31",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
